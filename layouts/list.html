{{ define "main" }}
  <section class="content-page">
    <header>
      <h1>{{ .Title }}</h1>
      {{ with .Content }}<div>{{ . }}</div>{{ end }}
    </header>
    <ol class="post-list">
      {{ range .Pages }}
        <li>
          <time class="post-meta" datetime="{{ .Date.Format `2006-01-02` }}">
            {{ .Date.Format "2006-01-02" }}
          </time>
          <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
        </li>
      {{ else }}
        <li>暂无内容。</li>
      {{ end }}
    </ol>
  </section>
{{ end }}
